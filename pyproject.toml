[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atomzero"
version = "2.1.0"
description = "Atom Zero: a local source-cited 63M assistant with RAG, documents, evidence and constrained tools."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Gokhan Cava", email = "gokhancava@gmail.com" }]
keywords = ["atom-zero", "local-assistant", "rag", "source-citation", "small-language-model", "pypdf"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch",
  "tokenizers",
  "numpy",
  "pypdf>=4",
  "python-docx>=1.1",
]

[project.optional-dependencies]
neural = ["transformers>=4.40"]

[project.scripts]
atomzero = "atomzero.chat_server:main"
atomzero-quickstart = "atomzero.quickstart:main"
atomzero-doctor = "atomzero.doctor:main"
atomzero-docs = "atomzero.doc_memory:main"
atomzero-hungry = "atomzero.hungry:main"
atomzero-escalate = "atomzero.escalation:main"
atomzero-growth = "atomzero.growth_report:main"
atomzero-adapter-candidate = "atomzero.adapter_candidates:main"
atomzero-skills = "atomzero.skills:main"
atomzero-brief = "atomzero.briefing:main"
atomzero-plan = "atomzero.plan_audit:main"
atomzero-audit = "atomzero.audit:main"
atomzero-coverage = "atomzero.aisc_coverage:main"
atomzero-gate = "atomzero.evaluation:main"
atomzero-improve = "atomzero.improvement:main"
atomzero-scoreboard = "atomzero.scoreboard:main"
atomzero-trend = "atomzero.trend:main"
atomzero-drift = "atomzero.drift:main"
atomzero-agent-bridge = "atomzero.agent_bridge:main"
atomzero-agent-run = "atomzero.agent_runner:main"
atomzero-self-code = "atomzero.self_code:main"
atomzero-self-code-diff = "atomzero.self_code_diff:main"
atomzero-self-improve = "atomzero.self_improve:main"
atomzero-memory-ledger = "atomzero.memory_ledger:main"
atomzero-claims = "atomzero.claims:main"
atomzero-verify-teacher = "atomzero.teacher_verification:main"
atomzero-consensus = "atomzero.consensus:main"
atomzero-freshness = "atomzero.freshness:main"
atomzero-temporal = "atomzero.temporal:main"
atomzero-reliability = "atomzero.reliability:main"
atomzero-doc-diff = "atomzero.version_diff:main"
atomzero-aisc-spec = "atomzero.aisc_spec:main"
atomzero-copy = "atomzero.copy_tool:main"

[project.urls]
Homepage = "https://github.com/byjameson/atom-zero"
Source = "https://github.com/byjameson/atom-zero"
Documentation = "https://github.com/byjameson/atom-zero#readme"
ModelScope = "https://modelscope.cn/models/byjameson/atom-zero-63m-balanced"
"Live Demo" = "https://modelscope.cn/studios/byjameson/atomzerodemo"
LinkedIn = "https://www.linkedin.com/in/g%C3%B6khan-cava-874a32157/"
X = "https://x.com/aigokhan"
Instagram = "https://instagram.com/quantsinner"
Issues = "https://github.com/byjameson/atom-zero/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
atomzero = ["moderation_head.json"]

[tool.setuptools]
license-files = ["LICENSE", "NOTICE"]

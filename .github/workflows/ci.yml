name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU torch and test deps
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install pytest tokenizers numpy pypdf python-docx build
      - name: Install package
        run: pip install -e .
      - name: Tests
        run: python -m pytest tests -q
      - name: Build and entry points
        run: |
          python -m build
          pip install --no-deps --force-reinstall dist/*.whl
          atomzero --help
          atomzero-quickstart --help

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install CPU torch and test deps
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install pytest tokenizers numpy pypdf python-docx build scikit-learn
      - name: Install package
        run: pip install -e .
      - name: Tests
        run: python -m pytest tests -q
      - name: Document benchmark
        run: python research/benchmark_documents.py --out /tmp/document_benchmark.json --check
      - name: Safety and injection red-team
        run: |
          python research/redteam_safety.py --out /tmp/redteam_safety.json
          python research/redteam_injection.py --out /tmp/redteam_injection.json
      - name: Build and entry points
        run: |
          python -m build
          pip install --no-deps --force-reinstall dist/*.whl
          atomzero --help
          atomzero-quickstart --help
